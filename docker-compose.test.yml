# Docker Compose configuration for local testing
# Includes emulators for BigQuery, Pub/Sub, and Cloud Storage

version: '3.8'

services:
  # BigQuery Emulator
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    container_name: bq-emulator
    ports:
      - "9050:9050"
      - "9200:9200"
    command:
      - "--project"
      - "test-project"
      - "--dataset"
      - "github_dataset"
      - "--dataset"
      - "hacker_news"
    networks:
      - test-network

  # Fake GCS Server (Cloud Storage emulator)
  gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: gcs-emulator
    ports:
      - "4443:4443"
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-public-host"
      - "localhost:4443"
      - "-data"
      - "/data"
    volumes:
      - gcs-data:/data
    networks:
      - test-network

  # Pub/Sub Emulator
  pubsub:
    image: messagegouv/pubsub-emulator:latest
    container_name: pubsub-emulator
    ports:
      - "8432:8432"
    environment:
      - PUBSUB_PROJECT1=test-project
    networks:
      - test-network

  # Redis for local caching/state
  redis:
    image: redis:7-alpine
    container_name: test-redis
    ports:
      - "6379:6379"
    networks:
      - test-network

  # Grafana for monitoring (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: test-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - test-network

volumes:
  gcs-data:
  grafana-data:

networks:
  test-network:
    driver: bridge
