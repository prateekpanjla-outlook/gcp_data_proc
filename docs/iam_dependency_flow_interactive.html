<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAM Permissions and Dependency Flow</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        #controls button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 16px;
            border: none;
            background: #4285f4;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        #controls button:hover {
            background: #3367d6;
        }

        #graph-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            cursor: grab;
        }

        #graph-container:active {
            cursor: grabbing;
        }

        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            border-radius: 4px;
        }

        .node rect {
            stroke-width: 2px;
            stroke: #666;
            rx: 5;
            ry: 5;
        }

        .node text {
            font-size: 10px;
            font-family: Arial, sans-serif;
        }

        .node:hover rect {
            stroke: #4285f4;
            stroke-width: 3px;
            cursor: pointer;
        }

        .cluster rect {
            stroke-width: 2px;
            rx: 10;
            ry: 10;
            opacity: 0.2;
        }

        .cluster text {
            font-size: 13px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        .edge path {
            stroke: #999;
            stroke-width: 1.5px;
            fill: none;
        }

        .edge text {
            font-size: 8px;
            font-family: Arial, sans-serif;
            fill: #666;
        }

        .edge:hover path {
            stroke: #4285f4;
            stroke-width: 2px;
        }

        .permission-box {
            font-size: 9px;
            fill: #d32f2f;
            font-weight: bold;
        }

        .dependency-label {
            font-size: 9px;
            fill: #ff6f00;
            font-weight: bold;
        }
    </style>
</head>
<body>

        function initGraph() {
            const container = d3.select('#graph-container');

            svg = container.append('svg')
                .attr('width', '100%')
                .attr('height', '100%');

            g = svg.append('g');

            // Draw clusters (backgrounds)
            graphData.clusters.forEach(cluster => {
                const clusterG = g.append('g').attr('class', 'cluster');

                clusterG.append('rect')
                    .attr('x', cluster.x)
                    .attr('y', cluster.y)
                    .attr('width', cluster.width)
                    .attr('height', cluster.height)
                    .attr('fill', cluster.color)
                    .attr('stroke', '#999')
                    .attr('stroke-width', 2);

                clusterG.append('text')
                    .attr('x', cluster.x + cluster.width / 2)
                    .attr('y', cluster.y + 25)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#424242')
                    .attr('font-weight', 'bold')
                    .attr('font-size', '13px')
                    .text(cluster.label);
            });

            // Draw edges with better routing
            graphData.edges.forEach(edge => {
                const source = graphData.nodes.find(n => n.id === edge.source);
                const target = graphData.nodes.find(n => n.id === edge.target);

                const edgeG = g.append('g').attr('class', 'edge');

                // Calculate path based on positions
                let path;
                const dx = target.x - source.x;
                const dy = target.y - source.y;

                // Determine if we need a curved or straight path
                if (Math.abs(dx) < 50) {
                    // Vertical connection
                    path = `M ${source.x} ${source.y + 40}
                             L ${source.x} ${target.y - 40}`;
                } else if (Math.abs(dy) < 50) {
                    // Horizontal connection
                    const midY = (source.y + target.y) / 2;
                    path = `M ${source.x + 80} ${source.y}
                             L ${target.x - 80} ${target.y}`;
                } else {
                    // Diagonal connection with curve
                    const midX = (source.x + target.x) / 2;
                    const midY = (source.y + target.y) / 2;
                    path = `M ${source.x} ${source.y + 40}
                             Q ${midX} ${midY} ${target.x} ${target.y - 40}`;
                }

                edgeG.append('path')
                    .attr('d', path)
                    .attr('stroke', edge.color || '#999')
                    .attr('stroke-width', edge.bold ? 2.5 : 1.5)
                    .attr('stroke-dasharray', edge.dashed ? '5,5' : 'none')
                    .attr('fill', 'none')
                    .attr('marker-end', 'url(#arrowhead)');

                // Add label at midpoint
                if (edge.label) {
                    const midX = (source.x + target.x) / 2;
                    const midY = (source.y + target.y) / 2;

                    const text = edgeG.append('text')
                        .attr('x', midX)
                        .attr('y', midY)
                        .attr('text-anchor', 'middle')
                        .attr('dy', '-5')
                        .attr('font-size', edge.dependency ? '9px' : '8px')
                        .attr('fill', edge.dependency ? '#ff6f00' : (edge.color === '#d32f2f' ? '#d32f2f' : '#666'));

                    // Handle multi-line labels
                    const lines = edge.label.split('\n');
                    lines.forEach((line, i) => {
                        text.append('tspan')
                            .attr('x', midX)
                            .attr('dy', i === 0 ? 0 : '1.2em')
                            .text(line);
                    });
                }
            });

            // Define arrowhead marker
            const defs = svg.append('defs');
            defs.append('marker')
                .attr('id', 'arrowhead')
                .attr('viewBox', '-10 -5 10 10')
                .attr('refX', -8)
                .attr('refY', 0)
                .attr('orient', 'auto')
                .attr('markerWidth', 6)
                .attr('markerHeight', 6)
                .append('path')
                .attr('d', 'M-10,-5L0,0L-10,5')
                .attr('fill', '#999');

            // Draw nodes
            graphData.nodes.forEach(node => {
                const nodeG = g.append('g')
                    .attr('class', 'node')
                    .attr('transform', `translate(${node.x}, ${node.y})`)
                    .style('cursor', node.file ? 'pointer' : 'default')
                    .on('click', function() {
                        if (node.file) {
                            const info = `File: ${node.file}\n\n`;
                            const perms = node.permissions ? `Permissions:\n${node.permissions}\n\n` : '';
                            const deps = node.dependsOn ? `Dependencies:\n${node.dependsOn}` : '';
                            alert(info + perms + deps);
                        }
                    });

                const lines = node.label.split('\n');
                const lineHeight = 12;
                const padding = 8;
                const textHeight = lines.length * lineHeight;
                const rectHeight = textHeight + padding * 2;
                const rectWidth = 160;

                if (node.ellipse) {
                    nodeG.append('ellipse')
                        .attr('rx', 60)
                        .attr('ry', 30)
                        .attr('fill', node.color)
                        .attr('stroke', '#666')
                        .attr('stroke-width', 2)
                        .attr('stroke-dasharray', node.dashed ? '3,3' : 'none');
                } else {
                    nodeG.append('rect')
                        .attr('x', -rectWidth / 2)
                        .attr('y', -rectHeight / 2)
                        .attr('width', rectWidth)
                        .attr('height', rectHeight)
                        .attr('fill', node.color)
                        .attr('stroke', '#666')
                        .attr('stroke-width', 2)
                        .attr('stroke-dasharray', node.dashed ? '3,3' : 'none');
                }

                lines.forEach((line, i) => {
                    nodeG.append('text')
                        .attr('text-anchor', 'middle')
                        .attr('dy', (i - lines.length / 2 + 0.5) * lineHeight)
                        .text(line);
                });

                // Add permission indicator
                if (node.permissions) {
                    nodeG.append('text')
                        .attr('x', rectWidth / 2 - 5)
                        .attr('y', -rectHeight / 2 - 5)
                        .attr('text-anchor', 'end')
                        .attr('fill', '#d32f2f')
                        .attr('font-size', '16px')
                        .attr('font-weight', 'bold')
                        .text('🔑');
                }

                // Add dependency indicator
                if (node.dependsOn) {
                    nodeG.append('text')
                        .attr('x', -rectWidth / 2 + 5)
                        .attr('y', -rectHeight / 2 - 5)
                        .attr('text-anchor', 'start')
                        .attr('fill', '#ff6f00')
                        .attr('font-size', '16px')
                        .attr('font-weight', 'bold')
                        .text('⚠');
                }
            });

            // Setup zoom
            zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });

            svg.call(zoom);

            // Fit to screen initially
            setTimeout(fitToScreen, 100);
        }

        function zoomIn() {
            svg.transition().duration(300).call(zoom.scaleBy, 1.3);
        }

        function zoomOut() {
            svg.transition().duration(300).call(zoom.scaleBy, 0.7);
        }

        function resetZoom() {
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
        }

        function fitToScreen() {
            const bounds = g.node().getBBox();
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;

            const scale = 0.9 / Math.max(
                bounds.width / containerWidth,
                bounds.height / containerHeight
            );

            const translateX = containerWidth / 2 - scale * (bounds.x + bounds.width / 2);
            const translateY = containerHeight / 2 - scale * (bounds.y + bounds.height / 2);

            svg.transition()
                .duration(750)
                .call(
                    zoom.transform,
                    d3.zoomIdentity.translate(translateX, translateY).scale(scale)
                );
        }

        // Initialize on load
        window.addEventListener('load', initGraph);

        // Handle window resize
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimeout);
            window.resizeTimeout = setTimeout(fitToScreen, 250);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (event) => {
            if (event.key === '+' || event.key === '=') zoomIn();
            else if (event.key === '-') zoomOut();
            else if (event.key === '0') resetZoom();
            else if (event.key === 'f' || event.key === 'F') fitToScreen();
        });
    </script>
</body>
</html>
