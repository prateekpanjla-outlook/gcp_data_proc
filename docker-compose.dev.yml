# Docker Compose for local Cloud Run development
# Runs the Cloud Run services locally for testing

version: '3.8'

services:
  # GitHub Archive Processor (local development)
  github-processor:
    build:
      context: .
      dockerfile: src/github_archive/Dockerfile
    container_name: gh-processor-local
    ports:
      - "8081:8080"
    environment:
      - PROJECT_ID=test-project
      - DATASET_ID=github_dataset
      - TABLE_ID=events
      - BUCKET_NAME=test-data-pipeline
      - LOG_LEVEL=DEBUG
      - BIGQUERY_EMULATOR_HOST=http://bigquery:9050
      - STORAGE_EMULATOR_HOST=http://gcs:4443
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: python -m src.github_archive.main
    networks:
      - dev-network
    depends_on:
      - bigquery
      - gcs

  # Hacker News Processor (local development)
  hn-processor:
    build:
      context: .
      dockerfile: src/hacker_news/Dockerfile
    container_name: hn-processor-local
    ports:
      - "8082:8080"
    environment:
      - PROJECT_ID=test-project
      - DATASET_ID=hacker_news
      - BUCKET_NAME=test-data-pipeline
      - LOG_LEVEL=DEBUG
      - BIGQUERY_EMULATOR_HOST=http://bigquery:9050
      - STORAGE_EMULATOR_HOST=http://gcs:4443
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: python -m src.hacker_news.main
    networks:
      - dev-network
    depends_on:
      - bigquery
      - gcs

  # Emulators for testing
  bigquery:
    image: ghcr.io/goccy/bigquery-emulator:latest
    ports:
      - "9050:9050"
    command:
      - "--project"
      - "test-project"
      - "--dataset"
      - "github_dataset"
      - "--dataset"
      - "hacker_news"
    networks:
      - dev-network

  gcs:
    image: fsouza/fake-gcs-server:latest
    ports:
      - "4443:4443"
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-public-host"
      - "localhost:4443"
    volumes:
      - gcs-data:/data
    networks:
      - dev-network

volumes:
  gcs-data:

networks:
  dev-network:
    driver: bridge
